<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Операции — быстрый буфер</title>
  <style>
    :root {
      --bg: #0f1419;
      --bg2: #161d26;
      --panel: #1a2330;
      --line: #2a3648;
      --text: #e8eef6;
      --muted: #8b9bb0;
      --accent: #3d8bfd;
      --accent-dim: #1e4a8a;
      --ok: #22c55e;
      --ok-bg: rgba(34, 197, 94, 0.22);
      --danger: #f07178;
      --tile: #1e2836;
      --tile-hover: #273246;
      --tile-border: #334155;
      --header-h: 56px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* —— Header —— */
    header {
      flex: 0 0 auto;
      height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }
    header .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-shrink: 0;
      min-width: 0;
    }
    header h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    header .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      white-space: nowrap;
    }
    header .back:hover { color: var(--accent); }

    .hdr-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      justify-content: flex-end;
      flex-wrap: nowrap;
    }

    .search-wrap {
      flex: 1 1 140px;
      max-width: 280px;
      min-width: 100px;
    }
    .search-wrap input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.25);
    }
    .search-wrap input::placeholder { color: var(--muted); }

    button, .btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      background: var(--panel);
      color: var(--text);
      white-space: nowrap;
      line-height: 1.2;
    }
    button:hover { background: var(--tile-hover); border-color: #44566e; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button.primary:hover { filter: brightness(1.08); }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border-color: transparent;
      padding: 7px 8px;
    }
    button.ghost:hover { color: var(--text); background: var(--panel); }
    button.danger {
      background: transparent;
      border-color: #5a2a2e;
      color: var(--danger);
    }
    button.danger:hover { background: rgba(240, 113, 120, 0.12); }
    button:disabled { opacity: 0.4; cursor: default; }

    /* —— Main grid —— */
    main {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 14px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(61, 139, 253, 0.08), transparent),
        var(--bg);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      align-content: start;
      min-height: 100%;
    }

    .tile {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 16px 14px;
      background: var(--tile);
      border: 1px solid var(--tile-border);
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
      transition: background 0.12s, border-color 0.12s, transform 0.08s, box-shadow 0.12s;
      word-break: break-word;
      line-height: 1.25;
    }
    .tile:hover {
      background: var(--tile-hover);
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 1px var(--accent-dim);
    }
    .tile:active { transform: scale(0.98); }
    .tile.copied {
      background: var(--ok-bg);
      border-color: var(--ok);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.35);
    }
    .tile.dragging {
      opacity: 0.45;
      border-style: dashed;
    }
    .tile.drag-over {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.4);
    }
    .tile .edit-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      display: none;
      gap: 4px;
    }
    body.edit-mode .tile .edit-badge { display: flex; }
    body.edit-mode .tile { cursor: grab; }
    body.edit-mode .tile:active { cursor: grabbing; }

    .icon-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 6px;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg2);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .icon-btn:hover { color: var(--text); border-color: #556; }
    .icon-btn.del:hover { color: var(--danger); border-color: #5a2a2e; }

    .empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 40vh;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
    }

    /* —— Toast —— */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #12261a;
      color: #86efac;
      border: 1px solid #166534;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
      max-width: min(90vw, 420px);
      text-align: center;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* —— Modal —— */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      width: min(420px, 100%);
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }
    .modal h2 {
      margin: 0 0 14px;
      font-size: 1.1rem;
    }
    .modal label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .modal input[type="text"] {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
    }
    .modal input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.25);
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* —— Context menu —— */
    #ctx {
      position: fixed;
      z-index: 60;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 4px;
      min-width: 160px;
      box-shadow: 0 12px 32px rgba(0,0,0,.45);
      display: none;
    }
    #ctx.open { display: block; }
    #ctx button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--text);
    }
    #ctx button:hover { background: var(--tile-hover); }
    #ctx button.danger { color: var(--danger); }

    .hint-bar {
      flex: 0 0 auto;
      padding: 4px 14px 8px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid transparent;
    }
    body.edit-mode .hint-bar {
      color: #fbbf24;
      border-top-color: var(--line);
      background: rgba(251, 191, 36, 0.06);
    }

    @media (max-width: 640px) {
      header { height: auto; min-height: var(--header-h); flex-wrap: wrap; padding: 8px 10px; gap: 8px; }
      .hdr-actions { flex-wrap: wrap; justify-content: flex-start; }
      .search-wrap { max-width: none; flex: 1 1 100%; order: 10; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
      .tile { min-height: 64px; font-size: 0.95rem; padding: 12px 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Операции</h1>
      <a class="back" href="index.html">← на главную</a>
    </div>
    <div class="hdr-actions">
      <div class="search-wrap">
        <input type="search" id="filter" placeholder="Фильтр…" autocomplete="off" />
      </div>
      <button type="button" class="primary" id="btnAdd" title="Добавить операцию">+ Добавить</button>
      <button type="button" class="ghost" id="btnEditMode" title="Режим правки">Правка</button>
      <button type="button" class="ghost" id="btnExport" title="Экспорт JSON">Экспорт</button>
      <button type="button" class="ghost" id="btnImport" title="Импорт JSON">Импорт</button>
      <button type="button" class="ghost" id="btnSeed" title="Загрузить шаблон операций из 1С">Шаблон 1С</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
  </header>

  <main>
    <div class="grid" id="grid" aria-label="Список операций"></div>
  </main>

  <div class="hint-bar" id="hintBar">
    Клик — скопировать · ПКМ — изменить / удалить · «Правка» — кнопки на плитках и перетаскивание
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle">Новая операция</h2>
      <label for="opText">Текст (копируется целиком)</label>
      <input type="text" id="opText" maxlength="200" placeholder="напр. 0108 Слесарная" />
      <div class="modal-actions">
        <button type="button" class="ghost" id="modalCancel">Отмена</button>
        <button type="button" class="danger" id="modalDelete" style="display:none; margin-right:auto">Удалить</button>
        <button type="button" class="primary" id="modalSave">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="ctx" role="menu">
    <button type="button" data-act="edit">Изменить…</button>
    <button type="button" data-act="copy">Копировать</button>
    <button type="button" class="danger" data-act="delete">Удалить</button>
  </div>

  <script>
(function () {
  'use strict';

  const STORAGE_KEY = 'ops_clipboard_v2';
  const SEED = [
    '0101 Разметка',
    '0108 Слесарная',
    '0109 Зачистка',
    '0125 Промывка',
    '0130 Очистка',
    '0131 Очистка пескоструйная',
    '0145 Изолирование, защита',
    '0180 Маркирование',
    '0190 Обезжиривание, обессмоливание',
    '0196 Удаление изоляции',
    '0405 Загрузка',
    '0407 Выгрузка',
    '2109 Вырубка',
    '2129 Гибка',
    '2142 Рельефная формовка',
    '2170 Штамповка',
    '4105 Резьбонарезная',
    '4110 Токарная',
    '4131 Круглошлифовальная',
    '4132 Внутришлифовальная',
    '4133 Плоскошлифовальная',
    '4152 Зубодолбежная',
    '4153 Зубофрезерная',
    '4181 Горизонтально-протяжная',
    '4210 Сверлильная',
    '4212 Радиально-сверлильная',
    '4221 Горизонтально-расточная',
    '4222 Вертикально-расточная',
    '4223 Координатно-расточная',
    '4233 Токарная с ЧПУ',
    '4234 Фрезерная с ЧПУ',
    '4260 Фрезерная',
    '4280 Отрезная',
    '5000 Термическая обработка',
    '5120 Диффузионное насыщение неметаллами',
    '7310 Грунтование',
    '7360 Окрашивание',
    '7361 Окрашивание распылением пневматическим',
    '7509 Профильно-вырезная электрофизическая электроэрозионная электроискровая проволочным электродом',
    '8800 Сборка',
    '8823 Запрессовывание',
    '8842 Развальцовка',
    '8846 Склеивание',
    '9000 Сварка',
    '9171 Термическая резка лазерная',
    '9172 Термическая резка кислородная',
    '9176 Термическая резка плазменно-дуговая',
  ];

  /** @type {{ id: string, text: string, order: number }[]} */
  let items = [];
  let editMode = false;
  let editingId = null;
  let ctxId = null;
  let dragId = null;
  let toastTimer = null;

  const grid = document.getElementById('grid');
  const filterEl = document.getElementById('filter');
  const toastEl = document.getElementById('toast');
  const backdrop = document.getElementById('modalBackdrop');
  const modalTitle = document.getElementById('modalTitle');
  const opText = document.getElementById('opText');
  const modalDelete = document.getElementById('modalDelete');
  const ctx = document.getElementById('ctx');
  const hintBar = document.getElementById('hintBar');
  const btnEditMode = document.getElementById('btnEditMode');

  function uid() {
    return 'op_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function normalizeFromLegacy(raw) {
    if (!Array.isArray(raw)) return null;
    const out = [];
    raw.forEach((row, i) => {
      if (!row || typeof row !== 'object') return;
      if (typeof row.text === 'string' && row.text.trim()) {
        out.push({
          id: String(row.id || uid()),
          text: row.text.trim(),
          order: typeof row.order === 'number' ? row.order : i
        });
        return;
      }
      // Old card format: title / body
      const title = (row.title || '').toString().trim();
      const body = (row.body || '').toString().trim();
      let text = '';
      if (body && !body.includes('\n') && body.length <= 80) {
        text = body;
      } else if (title && body && !body.includes('\n') && (title + ' ' + body).length <= 80) {
        text = (title + ' ' + body).trim();
      } else if (title) {
        text = title;
      } else if (body) {
        text = body.split('\n')[0].trim().slice(0, 80);
      }
      if (text) {
        out.push({ id: String(row.id || uid()), text, order: typeof row.order === 'number' ? row.order : i });
      }
    });
    return out.length ? out : null;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        items = SEED.map((text, i) => ({ id: uid(), text, order: i }));
        save();
        return;
      }
      const parsed = JSON.parse(raw);
      const migrated = normalizeFromLegacy(parsed);
      if (migrated) {
        items = migrated.sort((a, b) => a.order - b.order);
        // Re-save in new shape if needed
        save();
      } else {
        items = SEED.map((text, i) => ({ id: uid(), text, order: i }));
        save();
      }
    } catch {
      items = SEED.map((text, i) => ({ id: uid(), text, order: i }));
      save();
    }
  }

  function save() {
    items.forEach((it, i) => { it.order = i; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
  }

  async function copyText(text, tileEl) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      if (tileEl) {
        tileEl.classList.add('copied');
        setTimeout(() => tileEl.classList.remove('copied'), 500);
      }
      showToast('Скопировано: ' + text);
    } catch (e) {
      showToast('Не удалось скопировать');
    }
  }

  function getFiltered() {
    const q = (filterEl.value || '').trim().toLowerCase();
    const sorted = items.slice().sort((a, b) => a.order - b.order);
    if (!q) return sorted;
    return sorted.filter(it => it.text.toLowerCase().includes(q));
  }

  function render() {
    const list = getFiltered();
    grid.innerHTML = '';

    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = items.length
        ? '<div>Ничего не найдено</div>'
        : '<div>Пока нет операций</div><button type="button" class="primary" id="emptyAdd">+ Добавить первую</button>';
      grid.appendChild(empty);
      const b = empty.querySelector('#emptyAdd');
      if (b) b.addEventListener('click', () => openModal(null));
      return;
    }

    list.forEach(it => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.id = it.id;
      tile.tabIndex = 0;
      tile.setAttribute('role', 'button');
      tile.setAttribute('aria-label', 'Скопировать: ' + it.text);
      tile.draggable = editMode;

      const label = document.createElement('span');
      label.textContent = it.text;
      tile.appendChild(label);

      const badge = document.createElement('div');
      badge.className = 'edit-badge';
      const btnE = document.createElement('button');
      btnE.type = 'button';
      btnE.className = 'icon-btn';
      btnE.title = 'Изменить';
      btnE.textContent = '✎';
      btnE.addEventListener('click', e => {
        e.stopPropagation();
        openModal(it.id);
      });
      const btnD = document.createElement('button');
      btnD.type = 'button';
      btnD.className = 'icon-btn del';
      btnD.title = 'Удалить';
      btnD.textContent = '×';
      btnD.addEventListener('click', e => {
        e.stopPropagation();
        if (confirm('Удалить «' + it.text + '»?')) {
          items = items.filter(x => x.id !== it.id);
          save();
          render();
        }
      });
      badge.appendChild(btnE);
      badge.appendChild(btnD);
      tile.appendChild(badge);

      tile.addEventListener('click', () => {
        if (editMode) return; // edit mode uses drag / icon buttons
        copyText(it.text, tile);
      });
      tile.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (!editMode) copyText(it.text, tile);
        }
      });
      tile.addEventListener('contextmenu', e => {
        e.preventDefault();
        openCtx(e.clientX, e.clientY, it.id);
      });

      if (editMode) {
        tile.addEventListener('dragstart', e => {
          dragId = it.id;
          tile.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', it.id);
        });
        tile.addEventListener('dragend', () => {
          dragId = null;
          tile.classList.remove('dragging');
          grid.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        });
        tile.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          tile.classList.add('drag-over');
        });
        tile.addEventListener('dragleave', () => tile.classList.remove('drag-over'));
        tile.addEventListener('drop', e => {
          e.preventDefault();
          tile.classList.remove('drag-over');
          const fromId = dragId || e.dataTransfer.getData('text/plain');
          const toId = it.id;
          if (!fromId || fromId === toId) return;
          const fromIdx = items.findIndex(x => x.id === fromId);
          const toIdx = items.findIndex(x => x.id === toId);
          if (fromIdx < 0 || toIdx < 0) return;
          const [moved] = items.splice(fromIdx, 1);
          items.splice(toIdx, 0, moved);
          save();
          render();
        });
      }

      grid.appendChild(tile);
    });
  }

  function openModal(id) {
    editingId = id;
    closeCtx();
    if (id) {
      const it = items.find(x => x.id === id);
      modalTitle.textContent = 'Изменить операцию';
      opText.value = it ? it.text : '';
      modalDelete.style.display = '';
    } else {
      modalTitle.textContent = 'Новая операция';
      opText.value = '';
      modalDelete.style.display = 'none';
    }
    backdrop.classList.add('open');
    setTimeout(() => { opText.focus(); opText.select(); }, 30);
  }

  function closeModal() {
    backdrop.classList.remove('open');
    editingId = null;
  }

  function saveModal() {
    const text = opText.value.trim();
    if (!text) {
      opText.focus();
      return;
    }
    if (editingId) {
      const it = items.find(x => x.id === editingId);
      if (it) it.text = text;
    } else {
      items.push({ id: uid(), text, order: items.length });
    }
    save();
    closeModal();
    render();
  }

  function openCtx(x, y, id) {
    ctxId = id;
    ctx.classList.add('open');
    const pad = 8;
    const w = ctx.offsetWidth || 160;
    const h = ctx.offsetHeight || 120;
    let left = x;
    let top = y;
    if (left + w > window.innerWidth - pad) left = window.innerWidth - w - pad;
    if (top + h > window.innerHeight - pad) top = window.innerHeight - h - pad;
    ctx.style.left = Math.max(pad, left) + 'px';
    ctx.style.top = Math.max(pad, top) + 'px';
  }

  function closeCtx() {
    ctx.classList.remove('open');
    ctxId = null;
  }

  // —— Events ——
  document.getElementById('btnAdd').addEventListener('click', () => openModal(null));
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', saveModal);
  opText.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveModal(); }
    if (e.key === 'Escape') closeModal();
  });
  backdrop.addEventListener('click', e => {
    if (e.target === backdrop) closeModal();
  });
  modalDelete.addEventListener('click', () => {
    if (!editingId) return;
    const it = items.find(x => x.id === editingId);
    if (it && confirm('Удалить «' + it.text + '»?')) {
      items = items.filter(x => x.id !== editingId);
      save();
      closeModal();
      render();
    }
  });

  btnEditMode.addEventListener('click', () => {
    editMode = !editMode;
    document.body.classList.toggle('edit-mode', editMode);
    btnEditMode.textContent = editMode ? 'Готово' : 'Правка';
    btnEditMode.classList.toggle('primary', editMode);
    hintBar.textContent = editMode
      ? 'Режим правки: перетащите плитки · ✎ изменить · × удалить · «Готово» — выход'
      : 'Клик — скопировать · ПКМ — изменить / удалить · «Правка» — кнопки на плитках и перетаскивание';
    render();
  });

  filterEl.addEventListener('input', render);

  ctx.addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn || !ctxId) return;
    const act = btn.dataset.act;
    const it = items.find(x => x.id === ctxId);
    closeCtx();
    if (!it) return;
    if (act === 'edit') openModal(it.id);
    else if (act === 'copy') copyText(it.text, grid.querySelector('[data-id="' + it.id + '"]'));
    else if (act === 'delete' && confirm('Удалить «' + it.text + '»?')) {
      items = items.filter(x => x.id !== it.id);
      save();
      render();
    }
  });

  document.addEventListener('click', e => {
    if (!ctx.contains(e.target)) closeCtx();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeCtx();
      if (backdrop.classList.contains('open')) closeModal();
    }
  });

  document.getElementById('btnExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ops-clipboard.json';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('Экспорт JSON');
  });

  document.getElementById('btnImport').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const migrated = normalizeFromLegacy(parsed);
      if (!migrated) {
        alert('Файл не содержит операций в ожидаемом формате.');
        return;
      }
      if (items.length && !confirm('Заменить текущий список (' + items.length + ') данными из файла (' + migrated.length + ')?')) {
        return;
      }
      items = migrated.sort((a, b) => a.order - b.order);
      save();
      render();
      showToast('Импортировано: ' + items.length);
    } catch {
      alert('Не удалось прочитать JSON.');
    }
  });


  document.getElementById('btnSeed').addEventListener('click', () => {
    if (items.length && !confirm('Заменить текущий список (' + items.length + ') шаблоном 1С (' + SEED.length + ' операций)?')) {
      return;
    }
    items = SEED.map((text, i) => ({ id: uid(), text, order: i }));
    save();
    render();
    showToast('Шаблон 1С: ' + items.length + ' операций');
  });

  load();
  render();
})();
  </script>
</body>
</html>
