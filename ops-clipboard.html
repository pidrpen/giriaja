<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Операции — быстрый буфер</title>
  <style>
    :root {
      --bg: #0f1419;
      --bg2: #161d26;
      --panel: #1a2330;
      --line: #2a3648;
      --text: #e8eef6;
      --muted: #8b9bb0;
      --accent: #3d8bfd;
      --accent-dim: #1e4a8a;
      --ok: #22c55e;
      --ok-bg: rgba(34, 197, 94, 0.22);
      --danger: #f07178;
      --tile: #1e2836;
      --tile-hover: #273246;
      --tile-border: #334155;
      --header-h: 56px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* —— Header —— */
    header {
      flex: 0 0 auto;
      height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }
    header .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-shrink: 0;
      min-width: 0;
    }
    header h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    header .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      white-space: nowrap;
    }
    header .back:hover { color: var(--accent); }

    .hdr-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      justify-content: flex-end;
      flex-wrap: nowrap;
    }

    .search-wrap {
      flex: 1 1 140px;
      max-width: 280px;
      min-width: 100px;
    }
    .search-wrap input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.25);
    }
    .search-wrap input::placeholder { color: var(--muted); }

    button, .btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      background: var(--panel);
      color: var(--text);
      white-space: nowrap;
      line-height: 1.2;
    }
    button:hover { background: var(--tile-hover); border-color: #44566e; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button.primary:hover { filter: brightness(1.08); }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border-color: transparent;
      padding: 7px 8px;
    }
    button.ghost:hover { color: var(--text); background: var(--panel); }
    button.danger {
      background: transparent;
      border-color: #5a2a2e;
      color: var(--danger);
    }
    button.danger:hover { background: rgba(240, 113, 120, 0.12); }
    button:disabled { opacity: 0.4; cursor: default; }

    /* —— Main grid —— */
    main {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 14px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(61, 139, 253, 0.08), transparent),
        var(--bg);
    }

    /* Группы как столбцы Excel: внутри группы плитки идут сверху вниз */
    .grid {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      align-content: start;
      gap: 14px;
      min-height: 100%;
    }
    .op-group {
      flex: 1 1 160px;
      min-width: 150px;
      max-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(42, 54, 72, 0.85);
    }
    .op-group-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 2px 4px 6px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 2px;
      line-height: 1.25;
    }
    .op-group .tile {
      width: 100%;
      min-height: 56px;
      padding: 12px 10px;
      font-size: 0.95rem;
    }
    .grid.flat-mode {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .grid.flat-mode .op-group {
      display: contents;
    }
    .grid.flat-mode .op-group-title {
      display: none;
    }

    .tile {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 16px 14px;
      background: var(--tile);
      border: 1px solid var(--tile-border);
      border-radius: 12px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
      transition: background 0.12s, border-color 0.12s, transform 0.08s, box-shadow 0.12s;
      word-break: break-word;
      line-height: 1.25;
    }
    .tile:hover {
      background: var(--tile-hover);
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 1px var(--accent-dim);
    }
    .tile:active { transform: scale(0.98); }
    .tile.copied {
      background: var(--ok-bg);
      border-color: var(--ok);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.35);
    }
    .tile.dragging {
      opacity: 0.45;
      border-style: dashed;
    }
    .tile.drag-over {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.4);
      transform: scale(1.03);
    }
    .tile.drag-ready {
      cursor: grabbing;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
      z-index: 2;
    }
    .tile .edit-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      display: none;
      gap: 4px;
    }
    body.edit-mode .tile .edit-badge { display: flex; }
    body.edit-mode .tile { cursor: grab; }
    .tile:active { cursor: grabbing; }

    .icon-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 6px;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg2);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .icon-btn:hover { color: var(--text); border-color: #556; }
    .icon-btn.del:hover { color: var(--danger); border-color: #5a2a2e; }

    .empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 40vh;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
    }

    /* —— Toast —— */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #12261a;
      color: #86efac;
      border: 1px solid #166534;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
      max-width: min(90vw, 420px);
      text-align: center;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* —— Modal —— */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      width: min(420px, 100%);
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }
    .modal h2 {
      margin: 0 0 14px;
      font-size: 1.1rem;
    }
    .modal label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .modal input[type="text"] {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
    }
    .modal input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.25);
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* —— Context menu —— */
    #ctx {
      position: fixed;
      z-index: 60;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 4px;
      min-width: 160px;
      box-shadow: 0 12px 32px rgba(0,0,0,.45);
      display: none;
    }
    #ctx.open { display: block; }
    #ctx button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--text);
    }
    #ctx button:hover { background: var(--tile-hover); }
    #ctx button.danger { color: var(--danger); }

    .hint-bar {
      flex: 0 0 auto;
      padding: 4px 14px 8px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid transparent;
    }
    body.edit-mode .hint-bar {
      color: #fbbf24;
      border-top-color: var(--line);
      background: rgba(251, 191, 36, 0.06);
    }

    @media (max-width: 640px) {
      header { height: auto; min-height: var(--header-h); flex-wrap: wrap; padding: 8px 10px; gap: 8px; }
      .hdr-actions { flex-wrap: wrap; justify-content: flex-start; }
      .search-wrap { max-width: none; flex: 1 1 100%; order: 10; }
      .grid { gap: 10px; }
      .op-group { min-width: 140px; max-width: none; flex: 1 1 140px; }
      .op-group .tile { min-height: 52px; font-size: 0.9rem; padding: 10px 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Операции</h1>
      <a class="back" href="index.html">← на главную</a>
    </div>
    <div class="hdr-actions">
      <div class="search-wrap">
        <input type="search" id="filter" placeholder="Фильтр…" autocomplete="off" />
      </div>
      <button type="button" class="primary" id="btnAdd" title="Добавить операцию">+ Добавить</button>
      <button type="button" class="ghost" id="btnEditMode" title="Режим правки">Правка</button>
      <button type="button" class="ghost" id="btnExport" title="Экспорт JSON">Экспорт</button>
      <button type="button" class="ghost" id="btnImport" title="Импорт JSON">Импорт</button>
      <button type="button" class="ghost" id="btnSeed" title="Загрузить шаблон операций из 1С">Шаблон 1С</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
  </header>

  <main>
    <div class="grid" id="grid" aria-label="Список операций"></div>
  </main>

  <div class="hint-bar" id="hintBar">
    Группы как в шаблоне 1С (столбики) · клик — копировать · перетаскивание — порядок · «Правка» — ✎/×
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle">Новая операция</h2>
      <label for="opText">Текст (копируется целиком)</label>
      <input type="text" id="opText" maxlength="200" placeholder="напр. 0108 Слесарная" />
      <div class="modal-actions">
        <button type="button" class="ghost" id="modalCancel">Отмена</button>
        <button type="button" class="danger" id="modalDelete" style="display:none; margin-right:auto">Удалить</button>
        <button type="button" class="primary" id="modalSave">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="ctx" role="menu">
    <button type="button" data-act="edit">Изменить…</button>
    <button type="button" data-act="copy">Копировать</button>
    <button type="button" class="danger" data-act="delete">Удалить</button>
  </div>

  <script>
(function () {
  'use strict';

  /**
   * Порядок и группы = столбцы «шабло 1с.xlsx» (сверху вниз в каждом столбце).
   * Так родственные операции (резка, слесарка, мех., окраска…) идут вертикально.
   */
  const STORAGE_KEY = 'ops_clipboard_v3';
  const GROUP_ORDER = [
    'cut',      // C7 — резка / ТО / насыщение
    'prep',     // C9 — разметка, слесарка, гибка, штамповка…
    'assembly', // C10 — сборка / сварка
    'grind',    // C11 — шлифовка / протяжка / ЭЭО
    'machine',  // C12 — токарная, фрезер, сверлильная…
    'coat',     // C13 — окраска / грунт / обезжиривание
    'other',
  ];
  const GROUP_LABELS = {
    cut: 'Резка и ТО',
    prep: 'Заготовка / слесарка',
    assembly: 'Сборка / сварка',
    grind: 'Шлифовка / ЭЭО',
    machine: 'Механообработка',
    coat: 'Окраска / покрытие',
    other: 'Прочее',
  };
  /** @type {{ text: string, group: string }[]} — порядок внутри группы = сверху вниз как в Excel */
  const SEED = [
    // C7
    { text: '9172 Термическая резка кислородная', group: 'cut' },
    { text: '9176 Термическая резка плазменно-дуговая', group: 'cut' },
    { text: '9171 Термическая резка лазерная', group: 'cut' },
    { text: '4280 Отрезная', group: 'cut' },
    { text: '5000 Термическая обработка', group: 'cut' },
    { text: '0131 Очистка пескоструйная', group: 'cut' },
    { text: '5120 Диффузионное насыщение неметаллами', group: 'cut' },
    // C9
    { text: '0101 Разметка', group: 'prep' },
    { text: '0108 Слесарная', group: 'prep' },
    { text: '0180 Маркирование', group: 'prep' },
    { text: '2129 Гибка', group: 'prep' },
    { text: '2170 Штамповка', group: 'prep' },
    { text: '2109 Вырубка', group: 'prep' },
    { text: '8842 Развальцовка', group: 'prep' },
    { text: '2142 Рельефная формовка', group: 'prep' },
    { text: '8846 Склеивание', group: 'prep' },
    { text: '0125 Промывка', group: 'prep' },
    { text: '4105 Резьбонарезная', group: 'prep' },
    { text: '8823 Запрессовывание', group: 'prep' },
    { text: '0109 Зачистка', group: 'prep' },
    // C10
    { text: '8800 Сборка', group: 'assembly' },
    { text: '9000 Сварка', group: 'assembly' },
    // C11
    { text: '4131 Круглошлифовальная', group: 'grind' },
    { text: '4132 Внутришлифовальная', group: 'grind' },
    { text: '4133 Плоскошлифовальная', group: 'grind' },
    { text: '4181 Горизонтально-протяжная', group: 'grind' },
    { text: '7509 Профильно-вырезная электрофизическая электроэрозионная электроискровая проволочным электродом', group: 'grind' },
    // C12
    { text: '4110 Токарная', group: 'machine' },
    { text: '4210 Сверлильная', group: 'machine' },
    { text: '4260 Фрезерная', group: 'machine' },
    { text: '4221 Горизонтально-расточная', group: 'machine' },
    { text: '4223 Координатно-расточная', group: 'machine' },
    { text: '4222 Вертикально-расточная', group: 'machine' },
    { text: '4233 Токарная с ЧПУ', group: 'machine' },
    { text: '4234 Фрезерная с ЧПУ', group: 'machine' },
    { text: '4212 Радиально-сверлильная', group: 'machine' },
    { text: '4152 Зубодолбежная', group: 'machine' },
    { text: '4153 Зубофрезерная', group: 'machine' },
    // C13
    { text: '7360 Окрашивание', group: 'coat' },
    { text: '0190 Обезжиривание, обессмоливание', group: 'coat' },
    { text: '0145 Изолирование, защита', group: 'coat' },
    { text: '7310 Грунтование', group: 'coat' },
    { text: '0196 Удаление изоляции', group: 'coat' },
    { text: '0407 Выгрузка', group: 'coat' },
    { text: '0405 Загрузка', group: 'coat' },
    { text: '0130 Очистка', group: 'coat' },
    { text: '7361 Окрашивание распылением пневматическим', group: 'coat' },
  ];

  const SEED_GROUP_BY_TEXT = Object.fromEntries(SEED.map((s) => [s.text, s.group]));

  function inferGroup(text) {
    const t = String(text || '').trim();
    if (SEED_GROUP_BY_TEXT[t]) return SEED_GROUP_BY_TEXT[t];
    const code = (t.match(/^(\d{3,5})\b/) || [])[1];
    if (!code) return 'other';
    const n = parseInt(code, 10);
    // эвристика по кодам 1С, если операция не из SEED
    if (n >= 9170 && n <= 9179) return 'cut';
    if (n === 4280 || n === 5000 || n === 5120 || n === 131) return 'cut';
    if (n >= 4100 && n < 4300) return 'machine';
    if (n >= 4130 && n <= 4139) return 'grind';
    if (n === 4181 || n === 7509) return 'grind';
    if (n === 8800 || n === 9000) return 'assembly';
    if (n >= 7300 && n < 7400) return 'coat';
    if (n === 190 || n === 145 || n === 196 || n === 130 || n === 405 || n === 407) return 'coat';
    if (n < 200 || n >= 2100 && n < 2200 || n === 8842 || n === 8846 || n === 8823 || n === 4105) return 'prep';
    return 'other';
  }

  function seedItems() {
    return SEED.map((s, i) => ({
      id: uid(),
      text: s.text,
      group: s.group,
      order: i,
    }));
  }

  /** @type {{ id: string, text: string, group: string, order: number }[]} */
  let items = [];
  let editMode = false;
  let editingId = null;
  let ctxId = null;
  let dragId = null;
  let toastTimer = null;

  const grid = document.getElementById('grid');
  const filterEl = document.getElementById('filter');
  const toastEl = document.getElementById('toast');
  const backdrop = document.getElementById('modalBackdrop');
  const modalTitle = document.getElementById('modalTitle');
  const opText = document.getElementById('opText');
  const modalDelete = document.getElementById('modalDelete');
  const ctx = document.getElementById('ctx');
  const hintBar = document.getElementById('hintBar');
  const btnEditMode = document.getElementById('btnEditMode');

  function uid() {
    return 'op_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function normalizeFromLegacy(raw) {
    if (!Array.isArray(raw)) return null;
    const out = [];
    raw.forEach((row, i) => {
      if (!row || typeof row !== 'object') return;
      if (typeof row.text === 'string' && row.text.trim()) {
        const text = row.text.trim();
        out.push({
          id: String(row.id || uid()),
          text,
          group: row.group && GROUP_LABELS[row.group] ? row.group : inferGroup(text),
          order: typeof row.order === 'number' ? row.order : i
        });
        return;
      }
      // Old card format: title / body
      const title = (row.title || '').toString().trim();
      const body = (row.body || '').toString().trim();
      let text = '';
      if (body && !body.includes('\n') && body.length <= 80) {
        text = body;
      } else if (title && body && !body.includes('\n') && (title + ' ' + body).length <= 80) {
        text = (title + ' ' + body).trim();
      } else if (title) {
        text = title;
      } else if (body) {
        text = body.split('\n')[0].trim().slice(0, 80);
      }
      if (text) {
        out.push({
          id: String(row.id || uid()),
          text,
          group: inferGroup(text),
          order: typeof row.order === 'number' ? row.order : i
        });
      }
    });
    return out.length ? out : null;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        items = seedItems();
        save();
        return;
      }
      const parsed = JSON.parse(raw);
      const migrated = normalizeFromLegacy(parsed);
      if (migrated) {
        items = migrated.sort((a, b) => a.order - b.order);
        items.forEach((it) => {
          if (!it.group || !GROUP_LABELS[it.group]) it.group = inferGroup(it.text);
        });
        save();
      } else {
        items = seedItems();
        save();
      }
    } catch {
      items = seedItems();
      save();
    }
  }

  function save() {
    items.forEach((it, i) => { it.order = i; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
  }

  async function copyText(text, tileEl) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      if (tileEl) {
        tileEl.classList.add('copied');
        setTimeout(() => tileEl.classList.remove('copied'), 500);
      }
      showToast('Скопировано: ' + text);
    } catch (e) {
      showToast('Не удалось скопировать');
    }
  }

  function getFiltered() {
    const q = (filterEl.value || '').trim().toLowerCase();
    const sorted = items.slice().sort((a, b) => a.order - b.order);
    if (!q) return sorted;
    return sorted.filter(it => it.text.toLowerCase().includes(q));
  }

  /** Собрать плитки по группам (порядок GROUP_ORDER); внутри — order */
  function groupItems(list) {
    const map = new Map();
    GROUP_ORDER.forEach((g) => map.set(g, []));
    list.forEach((it) => {
      const g = (it.group && map.has(it.group)) ? it.group : (inferGroup(it.text) || 'other');
      if (!map.has(g)) map.set(g, []);
      map.get(g).push(it);
    });
    return GROUP_ORDER
      .map((g) => ({ id: g, label: GROUP_LABELS[g] || g, items: map.get(g) || [] }))
      .filter((g) => g.items.length);
  }

  function moveItem(fromId, toId) {
    if (!fromId || !toId || fromId === toId) return;
    const fromIdx = items.findIndex(x => x.id === fromId);
    const toIdx = items.findIndex(x => x.id === toId);
    if (fromIdx < 0 || toIdx < 0) return;
    const targetGroup = items[toIdx].group;
    const [moved] = items.splice(fromIdx, 1);
    if (targetGroup) moved.group = targetGroup;
    const newToIdx = items.findIndex(x => x.id === toId);
    items.splice(newToIdx < 0 ? items.length : newToIdx, 0, moved);
    save();
    render();
    showToast('Порядок обновлён');
  }

  function bindTileDnD(tile, it) {
    tile.draggable = true;
    tile.addEventListener('dragstart', e => {
      dragId = it.id;
      tile.dataset.didDrag = '1';
      tile.classList.add('dragging', 'drag-ready');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', it.id); } catch (_) {}
    });
    tile.addEventListener('dragend', () => {
      dragId = null;
      tile.classList.remove('dragging', 'drag-ready');
      grid.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      setTimeout(() => { tile.dataset.didDrag = '0'; }, 50);
    });
    tile.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      grid.querySelectorAll('.drag-over').forEach(el => {
        if (el !== tile) el.classList.remove('drag-over');
      });
      tile.classList.add('drag-over');
    });
    tile.addEventListener('dragleave', () => tile.classList.remove('drag-over'));
    tile.addEventListener('drop', e => {
      e.preventDefault();
      e.stopPropagation();
      tile.classList.remove('drag-over');
      const fromId = dragId || e.dataTransfer.getData('text/plain');
      moveItem(fromId, it.id);
    });

    let holdTimer = null;
    let ptrStart = null;
    tile.addEventListener('pointerdown', e => {
      if (e.button != null && e.button !== 0) return;
      if (e.target.closest('.icon-btn')) return;
      ptrStart = { x: e.clientX, y: e.clientY };
      tile.dataset.didDrag = '0';
      holdTimer = setTimeout(() => tile.classList.add('drag-ready'), 160);
    });
    tile.addEventListener('pointerup', () => {
      clearTimeout(holdTimer);
      tile.classList.remove('drag-ready');
      ptrStart = null;
    });
    tile.addEventListener('pointercancel', () => {
      clearTimeout(holdTimer);
      tile.classList.remove('drag-ready');
      ptrStart = null;
    });
    tile.addEventListener('pointermove', e => {
      if (!ptrStart) return;
      if (Math.hypot(e.clientX - ptrStart.x, e.clientY - ptrStart.y) > 8) clearTimeout(holdTimer);
    });
  }

  function makeTile(it) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.id = it.id;
    tile.tabIndex = 0;
    tile.setAttribute('role', 'button');
    tile.setAttribute('aria-label', 'Скопировать: ' + it.text);

    const label = document.createElement('span');
    label.textContent = it.text;
    tile.appendChild(label);

    const badge = document.createElement('div');
    badge.className = 'edit-badge';
    const btnE = document.createElement('button');
    btnE.type = 'button';
    btnE.className = 'icon-btn';
    btnE.title = 'Изменить';
    btnE.textContent = '✎';
    btnE.addEventListener('click', e => {
      e.stopPropagation();
      openModal(it.id);
    });
    const btnD = document.createElement('button');
    btnD.type = 'button';
    btnD.className = 'icon-btn del';
    btnD.title = 'Удалить';
    btnD.textContent = '×';
    btnD.addEventListener('click', e => {
      e.stopPropagation();
      if (confirm('Удалить «' + it.text + '»?')) {
        items = items.filter(x => x.id !== it.id);
        save();
        render();
      }
    });
    badge.appendChild(btnE);
    badge.appendChild(btnD);
    tile.appendChild(badge);

    tile.addEventListener('click', () => {
      if (editMode) return;
      if (tile.dataset.didDrag === '1') {
        tile.dataset.didDrag = '0';
        return;
      }
      copyText(it.text, tile);
    });
    tile.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (!editMode) copyText(it.text, tile);
      }
    });
    tile.addEventListener('contextmenu', e => {
      e.preventDefault();
      openCtx(e.clientX, e.clientY, it.id);
    });

    bindTileDnD(tile, it);
    return tile;
  }

  function render() {
    const list = getFiltered();
    grid.innerHTML = '';
    grid.classList.remove('flat-mode');

    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = items.length
        ? '<div>Ничего не найдено</div>'
        : '<div>Пока нет операций</div><button type="button" class="primary" id="emptyAdd">+ Добавить первую</button>';
      grid.appendChild(empty);
      const b = empty.querySelector('#emptyAdd');
      if (b) b.addEventListener('click', () => openModal(null));
      return;
    }

    // при фильтре — плоская сетка; иначе столбцы-группы как в Excel
    const q = (filterEl.value || '').trim();
    if (q) {
      grid.classList.add('flat-mode');
      list.forEach((it) => grid.appendChild(makeTile(it)));
      return;
    }

    groupItems(list).forEach((g) => {
      const col = document.createElement('section');
      col.className = 'op-group';
      col.dataset.group = g.id;
      const title = document.createElement('div');
      title.className = 'op-group-title';
      title.textContent = g.label;
      col.appendChild(title);
      g.items.forEach((it) => col.appendChild(makeTile(it)));
      // drop on empty group title area → assign group
      col.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });
      col.addEventListener('drop', e => {
        // if drop on group background (not tile), append to group
        if (e.target.closest('.tile')) return;
        e.preventDefault();
        const fromId = dragId || e.dataTransfer.getData('text/plain');
        const fromIdx = items.findIndex(x => x.id === fromId);
        if (fromIdx < 0) return;
        const [moved] = items.splice(fromIdx, 1);
        moved.group = g.id;
        // order after last of this group
        const lastInGroup = items.filter(x => x.group === g.id).pop();
        if (lastInGroup) {
          const li = items.findIndex(x => x.id === lastInGroup.id);
          items.splice(li + 1, 0, moved);
        } else {
          items.push(moved);
        }
        save();
        render();
        showToast('→ ' + g.label);
      });
      grid.appendChild(col);
    });
  }

  function openModal(id) {
    editingId = id;
    closeCtx();
    if (id) {
      const it = items.find(x => x.id === id);
      modalTitle.textContent = 'Изменить операцию';
      opText.value = it ? it.text : '';
      modalDelete.style.display = '';
    } else {
      modalTitle.textContent = 'Новая операция';
      opText.value = '';
      modalDelete.style.display = 'none';
    }
    backdrop.classList.add('open');
    setTimeout(() => { opText.focus(); opText.select(); }, 30);
  }

  function closeModal() {
    backdrop.classList.remove('open');
    editingId = null;
  }

  function saveModal() {
    const text = opText.value.trim();
    if (!text) {
      opText.focus();
      return;
    }
    if (editingId) {
      const it = items.find(x => x.id === editingId);
      if (it) it.text = text;
    } else {
      items.push({ id: uid(), text, group: inferGroup(text), order: items.length });
    }
    save();
    closeModal();
    render();
  }

  function openCtx(x, y, id) {
    ctxId = id;
    ctx.classList.add('open');
    const pad = 8;
    const w = ctx.offsetWidth || 160;
    const h = ctx.offsetHeight || 120;
    let left = x;
    let top = y;
    if (left + w > window.innerWidth - pad) left = window.innerWidth - w - pad;
    if (top + h > window.innerHeight - pad) top = window.innerHeight - h - pad;
    ctx.style.left = Math.max(pad, left) + 'px';
    ctx.style.top = Math.max(pad, top) + 'px';
  }

  function closeCtx() {
    ctx.classList.remove('open');
    ctxId = null;
  }

  // —— Events ——
  document.getElementById('btnAdd').addEventListener('click', () => openModal(null));
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', saveModal);
  opText.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveModal(); }
    if (e.key === 'Escape') closeModal();
  });
  backdrop.addEventListener('click', e => {
    if (e.target === backdrop) closeModal();
  });
  modalDelete.addEventListener('click', () => {
    if (!editingId) return;
    const it = items.find(x => x.id === editingId);
    if (it && confirm('Удалить «' + it.text + '»?')) {
      items = items.filter(x => x.id !== editingId);
      save();
      closeModal();
      render();
    }
  });

  btnEditMode.addEventListener('click', () => {
    editMode = !editMode;
    document.body.classList.toggle('edit-mode', editMode);
    btnEditMode.textContent = editMode ? 'Готово' : 'Правка';
    btnEditMode.classList.toggle('primary', editMode);
    hintBar.textContent = editMode
      ? 'Режим правки: перетащите плитки · ✎ изменить · × удалить · «Готово» — выход'
      : 'Клик — скопировать · ПКМ — изменить / удалить · «Правка» — кнопки на плитках и перетаскивание';
    render();
  });

  filterEl.addEventListener('input', render);

  ctx.addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn || !ctxId) return;
    const act = btn.dataset.act;
    const it = items.find(x => x.id === ctxId);
    closeCtx();
    if (!it) return;
    if (act === 'edit') openModal(it.id);
    else if (act === 'copy') copyText(it.text, grid.querySelector('[data-id="' + it.id + '"]'));
    else if (act === 'delete' && confirm('Удалить «' + it.text + '»?')) {
      items = items.filter(x => x.id !== it.id);
      save();
      render();
    }
  });

  document.addEventListener('click', e => {
    if (!ctx.contains(e.target)) closeCtx();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeCtx();
      if (backdrop.classList.contains('open')) closeModal();
    }
  });

  document.getElementById('btnExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ops-clipboard.json';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('Экспорт JSON');
  });

  document.getElementById('btnImport').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const migrated = normalizeFromLegacy(parsed);
      if (!migrated) {
        alert('Файл не содержит операций в ожидаемом формате.');
        return;
      }
      if (items.length && !confirm('Заменить текущий список (' + items.length + ') данными из файла (' + migrated.length + ')?')) {
        return;
      }
      items = migrated.sort((a, b) => a.order - b.order);
      save();
      render();
      showToast('Импортировано: ' + items.length);
    } catch {
      alert('Не удалось прочитать JSON.');
    }
  });


  document.getElementById('btnSeed').addEventListener('click', () => {
    if (items.length && !confirm('Заменить текущий список (' + items.length + ') шаблоном 1С (' + SEED.length + ' операций)?')) {
      return;
    }
    items = seedItems();
    save();
    render();
    showToast('Шаблон 1С: ' + items.length + ' операций, ' + GROUP_ORDER.filter(g => g !== 'other').length + ' групп');
  });

  load();
  render();
})();
  </script>
</body>
