<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Расчётник резки · giriaja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    :root {
      --bg: #0c0e12; --surface: #141820; --surface-2: #1b212c;
      --border: #2a3344; --fg: #e8ecf2; --muted: #8b95a8; --faint: #5c6678;
      --primary: #3d8bfd; --accent: #5eead4; --warn: #f0b429; --ok: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background:
        radial-gradient(ellipse 90% 50% at 10% -10%, rgba(61,139,253,.12), transparent 55%),
        radial-gradient(ellipse 70% 40% at 100% 0%, rgba(94,234,212,.06), transparent 50%),
        var(--bg);
      color: var(--fg); min-height: 100vh; margin: 0; overflow-x: hidden;
    }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .tabular { font-variant-numeric: tabular-nums; }
    .chip {
      min-height: 40px; min-width: 48px; border: 1px solid var(--border);
      background: var(--surface-2); border-radius: 8px; padding: 0 10px;
      font-size: 14px; font-weight: 500; color: var(--muted); transition: .15s;
    }
    .chip:hover { border-color: #3a465c; color: var(--fg); }
    .chip.active {
      border-color: var(--primary); background: rgba(61,139,253,.15); color: var(--primary);
    }
    select, input[type=number] {
      width: 100%; height: 40px; border: 1px solid var(--border);
      background: var(--surface); color: var(--fg); border-radius: 8px;
      padding: 0 12px; font-size: 14px;
    }
    select:focus, input:focus {
      outline: none; border-color: rgba(61,139,253,.5);
      box-shadow: 0 0 0 2px rgba(61,139,253,.25);
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
      border-radius: 8px; font-size: 13px; font-weight: 500;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--fg);
      cursor: pointer; transition: .15s;
    }
    .btn:hover { border-color: #3a465c; background: #232b38; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; font-size: 11px; text-transform: uppercase;
      letter-spacing: .04em; color: var(--muted); padding: 8px 12px;
      border-bottom: 1px solid var(--border); background: rgba(27,33,44,.8);
    }
    td { padding: 10px 12px; border-bottom: 1px solid rgba(42,51,68,.6); }
    tr:last-child td { border-bottom: 0; }
    .badge {
      display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; border: 1px solid;
    }
    .badge-laser { color: var(--primary); border-color: rgba(61,139,253,.3); background: rgba(61,139,253,.12); }
    .badge-plasma { color: var(--accent); border-color: rgba(94,234,212,.3); background: rgba(94,234,212,.1); }
    .badge-gas { color: var(--warn); border-color: rgba(240,180,41,.3); background: rgba(240,180,41,.1); }
    .badge-other { color: var(--muted); border-color: var(--border); background: var(--surface-2); }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr !important; }
      #stats { grid-template-columns: 1fr !important; }
      .desk-table { display: none !important; }
      .mob-cards { display: block !important; }
    }
    .mob-cards { display: none; }
  </style>
</head>
<body>
  <header style="position:sticky;top:0;z-index:40;border-bottom:1px solid rgba(42,51,68,.8);background:rgba(12,14,18,.88);backdrop-filter:blur(12px)">
    <div style="max-width:72rem;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px">
      <div style="display:flex;align-items:center;gap:12px;min-width:0">
        <a href="index.html" class="btn" style="padding:0 10px;height:36px" title="На главную"><i class="fa-solid fa-arrow-left"></i></a>
        <div style="width:40px;height:40px;border-radius:10px;background:rgba(61,139,253,.15);border:1px solid rgba(61,139,253,.25);display:grid;place-items:center;flex-shrink:0">
          <i class="fa-solid fa-calculator" style="color:var(--primary)"></i>
        </div>
        <div style="min-width:0">
          <div style="font-weight:600;font-size:16px">Расчётник резки</div>
          <div style="font-size:12px;color:var(--muted)">Нормы расхода · без цены · 125 позиций</div>
        </div>
      </div>
    </div>
  </header>

  <main style="max-width:72rem;margin:0 auto;padding:24px 20px 48px">
    <div class="layout" style="display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:24px">
      <div style="display:flex;flex-direction:column;gap:16px">
        <section class="card" style="padding:20px">
          <h2 style="margin:0 0 4px;font-size:16px">Параметры реза</h2>
          <p style="margin:0 0 16px;font-size:13px;color:var(--muted)">Материал, толщина и длина контура</p>
          <label style="display:block;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Материал</label>
          <select id="material" style="margin-bottom:16px"></select>
          <div style="font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Толщина, мм</div>
          <div id="thicknesses" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px"></div>
          <label style="display:block;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Длина реза, м</label>
          <input id="length" type="number" min="0.01" step="0.1" value="10" />
          <div id="quickLen" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
        </section>

        <section class="card" id="equipCard" style="padding:20px;display:none;background:linear-gradient(180deg,var(--surface),var(--surface-2));border-color:rgba(61,139,253,.2)">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
            <div>
              <div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Оборудование</div>
              <div id="equipName" style="margin-top:6px;font-size:14px;font-weight:500;line-height:1.35"></div>
            </div>
            <span id="equipBadge" class="badge badge-other"></span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
            <div>
              <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em"><i class="fa-solid fa-gauge-high" style="color:var(--primary);margin-right:4px"></i>Скорость</div>
              <div id="speedVal" class="tabular" style="font-weight:600;margin-top:2px"></div>
            </div>
            <div>
              <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em"><i class="fa-regular fa-clock" style="color:var(--accent);margin-right:4px"></i>Время</div>
              <div id="timeVal" class="tabular" style="font-weight:600;margin-top:2px"></div>
            </div>
          </div>
          <div id="warnBox" style="display:none;margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid rgba(240,180,41,.3);background:rgba(240,180,41,.1);color:var(--warn);font-size:12px">
            <i class="fa-solid fa-triangle-exclamation"></i>
            Для этой позиции нормы расхода не заполнены.
          </div>
        </section>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div id="stats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"></div>
        <section class="card" style="overflow:hidden">
          <div style="padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-wrap:wrap">
            <div>
              <h2 style="margin:0;font-size:16px">Расход по позициям</h2>
              <p id="resultSub" style="margin:4px 0 0;font-size:13px;color:var(--muted)"></p>
            </div>
            <div style="display:flex;gap:8px">
              <button type="button" class="btn" id="btnCopy"><i class="fa-regular fa-copy"></i> Копировать</button>
              <button type="button" class="btn" id="btnCsv"><i class="fa-solid fa-download"></i> CSV</button>
            </div>
          </div>
          <div id="resultsBody" style="padding:16px 20px"></div>
        </section>
        <p style="text-align:center;font-size:12px;color:var(--faint);margin:0">Нормы приложения 2 (без фильтров) · газы м³/м · скорость м/мин · <a href="index.html" style="color:var(--muted)">giriaja</a></p>
      </div>
    </div>
  </main>

  let material = null;
  let thickness = null;

  function materials() {
    return [...new Set(NORMS.map(n => n.material))].sort((a,b)=>a.localeCompare(b,'ru'));
  }
  function thicknesses(m) {
    return [...new Set(NORMS.filter(n=>n.material===m).map(n=>n.thickness))].sort((a,b)=>a-b);
  }
  function findNorm(m,t) {
    return NORMS.find(n => n.material===m && n.thickness===t);
  }
  function fmt(n, d=4) {
    if (n==null || Number.isNaN(n)) return '—';
    return Number(n).toLocaleString('ru-RU', { maximumFractionDigits: d });
  }
  function fmtTime(min) {
    if (!Number.isFinite(min) || min<=0) return '—';
    if (min < 1) return Math.round(min*60) + ' с';
    if (min < 60) return fmt(min,1) + ' мин';
    const h = Math.floor(min/60), m = Math.round(min%60);
    return m ? h+' ч '+m+' мин' : h+' ч';
  }
  function equipKind(eq) {
    if (!eq) return '—';
    const e = eq.toLowerCase();
    if (e.includes('bystronic')||e.includes('fiber')||e.includes('лазер')) return 'Лазер';
    if (e.includes('плазма')||e.includes('vanad')) return 'Плазма';
    if (e.includes('кристал')||e.includes('мтр')) return 'Газовая резка';
    if (e.includes('гидро')) return 'Гидроабразив';
    return 'Прочее';
  }
  function badgeClass(k) {
    if (k==='Лазер') return 'badge-laser';
    if (k==='Плазма') return 'badge-plasma';
    if (k==='Газовая резка') return 'badge-gas';
    return 'badge-other';
  }

  function calc(m, t, lengthM) {
    const norm = findNorm(m, t);
    if (!norm || !(lengthM>0)) return null;
    const lines = [];
    function push(key, label, detail, unit, rate, group) {
      if (rate==null || rate===0) return;
      lines.push({ key, label, detail: detail||null, unit, ratePerM: rate, quantity: rate * lengthM, group });
    }
    push('grinding','Круг зачистной / лепестковый', norm.grindingDisc, 'шт', norm.grindingPerM, 'tooling');
    push('rag','Ветошь', null, 'кг', norm.ragPerM, 'aux');
    push('laserNozzle','Сопло лазер', norm.laserNozzle, 'шт', norm.laserNozzlePerM, 'tooling');
    push('plasmaCathode','Катод плазма', norm.plasmaCathode, 'шт', norm.plasmaCathodePerM, 'tooling');
    push('plasmaNozzle','Сопло плазма', norm.plasmaNozzle, 'шт', norm.plasmaNozzlePerM, 'tooling');
    push('plasmaTip','Наконечник сопла плазмы', norm.plasmaTip, 'шт', norm.plasmaTipPerM, 'tooling');
    push('mouthpiece','Мундштук', norm.mouthpiece, 'шт', norm.mouthpiecePerM, 'tooling');
    push('nitrogen','Азот', null, 'м³', norm.nitrogen, 'gas');
    push('argon','Аргон', null, 'м³', norm.argon, 'gas');
    push('hydrogen','Водород', null, 'м³', norm.hydrogen, 'gas');
    push('gasMix','Смесь газов', null, 'м³', norm.gasMix, 'gas');
    push('oxygen','Кислород', null, 'м³', norm.oxygen, 'gas');
    push('propane','Пропан', null, 'м³', norm.propane, 'gas');
    const timeMin = norm.speed!=null && norm.speed>0 ? lengthM/norm.speed : null;
    const incomplete = !norm.equipment || (String(norm.equipment).toLowerCase().includes('гидро') && norm.speed==null);
    return { norm, lengthM, timeMin, lines, incomplete };
  }

  function render() {
    const lengthM = parseFloat(String(document.getElementById('length').value).replace(',','.')) || 0;
    const result = calc(material, thickness, lengthM);
    const equipCard = document.getElementById('equipCard');
    if (!result) {
      equipCard.style.display = 'none';
      document.getElementById('stats').innerHTML = '';
      document.getElementById('resultsBody').innerHTML = '<p style="text-align:center;color:var(--muted);padding:32px 0">Укажите длину реза</p>';
      document.getElementById('resultSub').textContent = '';
      return;
    }
    equipCard.style.display = 'block';
    document.getElementById('equipName').textContent = result.norm.equipment || 'Не указано';
    const kind = equipKind(result.norm.equipment);
    const badge = document.getElementById('equipBadge');
    badge.textContent = kind;
    badge.className = 'badge ' + badgeClass(kind);
    document.getElementById('speedVal').textContent = result.norm.speed!=null ? fmt(result.norm.speed,2)+' м/мин' : '—';
    document.getElementById('timeVal').textContent = fmtTime(result.timeMin||0);
    document.getElementById('warnBox').style.display = result.incomplete ? 'block' : 'none';

    const tooling = result.lines.filter(l=>l.group==='tooling').length;
    const gas = result.lines.filter(l=>l.group==='gas').length;
    document.getElementById('stats').innerHTML = `
      <div class="card" style="padding:16px">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Оборудование</div>
        <div style="font-size:18px;font-weight:600;margin-top:6px">${kind}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${result.norm.speed!=null ? fmt(result.norm.speed,2)+' м/мин' : '—'}</div>
      </div>
      <div class="card" style="padding:16px;border-color:rgba(61,139,253,.3);background:rgba(61,139,253,.1)">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Время резки</div>
        <div class="tabular" style="font-size:20px;font-weight:600;margin-top:6px;color:var(--primary)">${fmtTime(result.timeMin||0)}</div>
      </div>
      <div class="card" style="padding:16px">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Позиций расхода</div>
        <div class="tabular" style="font-size:20px;font-weight:600;margin-top:6px">${result.lines.length}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">оснастка ${tooling} · газы ${gas}</div>
      </div>`;

    document.getElementById('resultSub').textContent =
      `${material} · ${thickness} мм · ${fmt(result.lengthM,2)} м реза`;

    const groups = [
      ['tooling','Оснастка и расходники'],
      ['gas','Газы'],
      ['aux','Вспомогательные']
    ];
    let html = '';
    for (const [g, title] of groups) {
      const items = result.lines.filter(l => l.group===g);
      if (!items.length) continue;
      html += `<div style="margin-bottom:18px">
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px">${title}</div>
        <div class="mob-cards">`;
      for (const l of items) {
        html += `<div style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;background:var(--surface-2)">
          <div style="font-weight:500">${l.label}</div>
          ${l.detail ? `<div class="mono" style="font-size:11px;color:var(--faint);margin-top:2px;word-break:break-all">${l.detail}</div>` : ''}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:12px">
            <div><span style="color:var(--muted)">Норма/м</span><div class="tabular" style="font-weight:500">${fmt(l.ratePerM)} ${l.unit}</div></div>
            <div><span style="color:var(--muted)">Расход</span><div class="tabular" style="font-weight:600;color:var(--primary)">${fmt(l.quantity)} ${l.unit}</div></div>
          </div>
        </div>`;
      }
      html += `</div>
        <div class="desk-table" style="overflow-x:auto;border:1px solid var(--border);border-radius:10px">
          <table>
            <thead><tr>
              <th>Позиция</th>
              <th style="text-align:right">Норма/м</th>
              <th style="text-align:right">Расход</th>
            </tr></thead><tbody>`;
      for (const l of items) {
        html += `<tr>
          <td><div style="font-weight:500">${l.label}</div>
            ${l.detail ? `<div class="mono" style="font-size:11px;color:var(--faint);margin-top:2px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.detail}</div>` : ''}
          </td>
          <td class="tabular" style="text-align:right;color:var(--muted)">${fmt(l.ratePerM)} ${l.unit}</td>
          <td class="tabular" style="text-align:right;font-weight:600;color:var(--primary)">${fmt(l.quantity)} ${l.unit}</td>
        </tr>`;
      }
      html += `</tbody></table></div></div>`;
    }
    if (!result.lines.length) {
      html = '<p style="text-align:center;color:var(--muted);padding:24px 0">Нет заполненных норм расхода</p>';
    }
    document.getElementById('resultsBody').innerHTML = html;
    window.__lastResult = result;
  }

  function setMaterial(m) {
    material = m;
    document.getElementById('material').value = m;
    const ts = thicknesses(m);
    if (!ts.includes(thickness)) thickness = ts[0];
    const box = document.getElementById('thicknesses');
    box.innerHTML = '';
    ts.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (t===thickness ? ' active' : '');
      b.textContent = t;
      b.onclick = () => { thickness = t; setMaterial(material); };
      box.appendChild(b);
    });
    render();
  }

  function init() {
    const mats = materials();
    const sel = document.getElementById('material');
    mats.forEach(m => {
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      sel.appendChild(o);
    });
    sel.onchange = () => setMaterial(sel.value);
    material = mats.includes('ст3') ? 'ст3' : mats[0];
    thickness = thicknesses(material)[0];

    document.getElementById('length').addEventListener('input', render);
    [1,5,10,25,50,100].forEach(v => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = v + ' м';
      b.onclick = () => { document.getElementById('length').value = v; render(); };
      document.getElementById('quickLen').appendChild(b);
    });

    document.getElementById('btnCopy').onclick = async () => {
      const r = window.__lastResult; if (!r) return;
      const lines = [
        `Расчёт резки: ${material} ${thickness} мм, L=${r.lengthM} м`,
        `Оборудование: ${r.norm.equipment||'—'}`,
        `Скорость: ${r.norm.speed??'—'} м/мин`,
        `Время: ${fmtTime(r.timeMin||0)}`,
        '',
        ...r.lines.map(l => `${l.label}${l.detail?' ('+l.detail+')':''}: ${fmt(l.quantity)} ${l.unit} (норма ${fmt(l.ratePerM)} /м)`)
      ];
      try {
        await navigator.clipboard.writeText(lines.join('\n'));
        document.getElementById('btnCopy').innerHTML = '<i class="fa-solid fa-check"></i> Скопировано';
        setTimeout(()=>{document.getElementById('btnCopy').innerHTML='<i class="fa-regular fa-copy"></i> Копировать'},1500);
      } catch(e){}
    };
    document.getElementById('btnCsv').onclick = () => {
      const r = window.__lastResult; if (!r) return;
      const rows = [
        ['Параметр','Значение'],
        ['Материал', material],
        ['Толщина, мм', String(thickness)],
        ['Длина реза, м', String(r.lengthM)],
        ['Оборудование', r.norm.equipment||''],
        ['Тип резки', equipKind(r.norm.equipment)],
        ['Скорость, м/мин', r.norm.speed!=null?String(r.norm.speed):''],
        ['Время резки, мин', r.timeMin!=null?String(r.timeMin):''],
        [],
        ['Позиция','Деталь/марка','Ед.','Норма на метр','Расход'],
        ...r.lines.map(l => [l.label, l.detail||'', l.unit, String(l.ratePerM), String(l.quantity)])
      ];
      const csv = rows.map(row => row.map(c => '"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
      const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `raschet-rezki-${material}-${thickness}mm-${r.lengthM}m.csv`;
      a.click();
    };

    setMaterial(material);
  }
  init();
  </script>
