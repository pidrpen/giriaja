<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Стратег — пиксельная RTS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <header id="topbar">
      <div class="brand">СТРАТЕГ</div>
      <div class="res">
        <img src="assets/ui/gold.png" alt="" width="16" height="16" />
        <span id="gold">0</span>
      </div>
      <div class="res">
        <img src="assets/ui/wood.png" alt="" width="16" height="16" />
        <span id="wood">0</span>
      </div>
      <div class="res">
        <img src="assets/ui/btn_worker.png" alt="" width="16" height="16" />
        <span id="pop">0 / 6</span>
      </div>
      <div class="res" id="idle-res" title="Свободные рабочие · Tab">
        <span class="idle-tag">простой</span>
        <span id="idle">0</span>
      </div>
      <div id="seed-label"></div>
      <a id="dl-game" href="strateg.zip" download="strateg.zip">Скачать игру</a>
    </header>

    <div id="toasts"></div>

    <footer id="bottom">
      <div id="portrait-wrap">
        <img id="portrait" alt="" />
      </div>
      <div id="info">
        <div id="info-title">Ничего не выбрано</div>
        <div id="info-sub">Выберите городской совет, чтобы призвать рабочих</div>
        <div id="queue"></div>
      </div>
      <div id="commands">
        <div class="cmd-wrap" id="wrap-worker">
          <button id="btn-worker" class="cmd-btn" disabled title="Рабочий (1) · 50 золота">
            <img src="assets/ui/btn_worker.png" alt="" />
            <span class="cost">50</span>
          </button>
          <div class="cmd-label">Рабочий · 1</div>
        </div>
        <div class="cmd-wrap is-hidden" id="wrap-house">
          <button id="btn-house" class="cmd-btn" disabled title="Хижина (F) · 30 золота · 50 дерева · +5 населения">
            <img src="assets/ui/btn_house.png" alt="" />
            <span class="cost">30</span>
          </button>
          <div class="cmd-label">Хижина · F</div>
        </div>
        <div class="cmd-wrap is-hidden" id="wrap-barracks">
          <button id="btn-barracks" class="cmd-btn" disabled title="Казармы (B) · 100 золота · 50 дерева">
            <img src="assets/ui/btn_barracks.png" alt="" />
            <span class="cost">100</span>
          </button>
          <div class="cmd-label">Казармы · B</div>
        </div>
        <div class="cmd-wrap is-hidden" id="wrap-tower">
          <button id="btn-tower" class="cmd-btn" disabled title="Башня (T) · 70 золота · 80 дерева">
            <img src="assets/ui/btn_tower.png" alt="" />
            <span class="cost">70</span>
          </button>
          <div class="cmd-label">Башня · T</div>
        </div>
        <div class="cmd-wrap is-hidden" id="wrap-militia">
          <button id="btn-militia" class="cmd-btn" disabled title="Ополченец (2) · 40 золота · 25 дерева">
            <img src="assets/ui/btn_militia.png" alt="" />
            <span class="cost">40</span>
          </button>
          <div class="cmd-label">Ополченец · 2</div>
        </div>
        <div class="cmd-wrap is-hidden" id="wrap-archer">
          <button id="btn-archer" class="cmd-btn" disabled title="Лучник (3) · 45 золота · 35 дерева">
            <img src="assets/ui/btn_archer.png" alt="" />
            <span class="cost">45</span>
          </button>
          <div class="cmd-label">Лучник · 3</div>
        </div>
        <div class="cmd-wrap is-hidden" id="wrap-rider">
          <button id="btn-rider" class="cmd-btn" disabled title="Всадник (4) · 80 золота · 40 дерева">
            <img src="assets/ui/btn_rider.png" alt="" />
            <span class="cost">80</span>
          </button>
          <div class="cmd-label">Всадник · 4</div>
        </div>
      </div>
      <canvas id="minimap" width="144" height="144"></canvas>
    </footer>
  </div>

  <div id="pause-banner" class="hidden">ПАУЗА</div>

  <div id="end-screen" class="hidden">
    <div class="end-card">
      <div class="end-title">ПОБЕДА</div>
      <div class="end-sub">Орочий лагерь пал.</div>
      <button id="btn-replay" class="end-btn" type="button" onclick="location.reload()">Ещё раз</button>
    </div>
  </div>

  <div id="boot">
    <div class="boot-card">
      <div class="boot-title">СТРАТЕГ</div>
      <div class="boot-sub">Пиксельная RTS</div>
      <div class="boot-msg" id="boot-msg">Загрузка…</div>
    </div>
  </div>

  <script src="js/game.js?v=anim1"></script>
</body>
</html>
